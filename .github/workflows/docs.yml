name: Documentation CI

on:
  pull_request:
    paths: ['docs/**', '.github/workflows/docs*.yml']
  push:
    paths: ['docs/**', '.github/workflows/docs*.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
